version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: finsight-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=sqlite+aiosqlite:///./finsight.db
      - SECRET_KEY=finsight-super-secret-jwt-key-2026-production-token-hash-xyz-987
      - REFRESH_SECRET_KEY=finsight-super-secret-refresh-key-2026-production-token-hash-abc-123
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:80","http://127.0.0.1:3000"]
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finsight-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
